name: CI (parser)

on:
  push:
    paths:
      - "parser/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and Run Snapshot Tests
        run: docker compose run -T --build --rm parser uv run ./snapshot_test.py
